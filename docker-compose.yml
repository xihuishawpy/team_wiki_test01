name: team-wiki-local

x-app-environment: &app-environment
  NODE_ENV: development
  LOG_LEVEL: info
  GITHUB_PUBLISH_ENABLED: 'false'
  GITHUB_READ_ENABLED: 'false'
  MODEL_ENABLED: 'false'

x-app-runtime: &app-runtime
  build:
    context: .
    target: runtime
  environment: *app-environment
  init: true
  read_only: true
  security_opt:
    - no-new-privileges:true
  tmpfs:
    - /tmp:size=64m,mode=1777

services:
  postgres:
    image: postgres:18.4-alpine3.23
    environment:
      POSTGRES_DB: team_wiki
      POSTGRES_USER: team_wiki_migrator
      POSTGRES_PASSWORD: ${TEAM_WIKI_MIGRATOR_DB_PASSWORD:-local_migrator_change_me}
      TEAM_WIKI_API_DB_PASSWORD: ${TEAM_WIKI_API_DB_PASSWORD:-local_api_change_me}
      TEAM_WIKI_PUBLISH_DB_PASSWORD: ${TEAM_WIKI_PUBLISH_DB_PASSWORD:-local_publish_change_me}
      TEAM_WIKI_CLASSIFY_DB_PASSWORD: ${TEAM_WIKI_CLASSIFY_DB_PASSWORD:-local_classify_change_me}
      TEAM_WIKI_RECONCILE_DB_PASSWORD: ${TEAM_WIKI_RECONCILE_DB_PASSWORD:-local_reconcile_change_me}
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U team_wiki_migrator -d team_wiki']
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./ops/postgres/init-roles.sh:/docker-entrypoint-initdb.d/001-init-roles.sh:ro

  migrate:
    <<: *app-runtime
    command: ['node', 'packages/platform/dist/migrations/cli.js', 'up']
    environment:
      <<: *app-environment
      DATABASE_URL: postgres://team_wiki_migrator:${TEAM_WIKI_MIGRATOR_DB_PASSWORD:-local_migrator_change_me}@postgres:5432/team_wiki
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  permissions:
    image: postgres:18.4-alpine3.23
    command:
      [
        'psql',
        'postgres://team_wiki_migrator:${TEAM_WIKI_MIGRATOR_DB_PASSWORD:-local_migrator_change_me}@postgres:5432/team_wiki',
        '-v',
        'ON_ERROR_STOP=1',
        '-f',
        '/permissions.sql',
      ]
    depends_on:
      migrate:
        condition: service_completed_successfully
    read_only: true
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./ops/postgres/permissions.sql:/permissions.sql:ro
    restart: 'no'

  fake-external:
    <<: *app-runtime
    command: ['node', 'apps/fake-external/dist/main.js']
    environment:
      NODE_ENV: development
      ALLOW_FAKE_EXTERNAL: 'true'
      FAKE_EXTERNAL_PORT: '4010'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:4010/health/live').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    <<: *app-runtime
    command: ['node', 'apps/api/dist/main.js']
    environment:
      <<: *app-environment
      APP_ROLE: api
      DATABASE_URL: postgres://team_wiki_api:${TEAM_WIKI_API_DB_PASSWORD:-local_api_change_me}@postgres:5432/team_wiki
    ports:
      - '${PORT:-3000}:3000'
    depends_on:
      permissions:
        condition: service_completed_successfully
      fake-external:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/health/live').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 10

  publish-worker:
    <<: *app-runtime
    command: ['node', 'apps/worker/dist/main.js', 'publish']
    environment:
      <<: *app-environment
      APP_ROLE: publish
      DATABASE_URL: postgres://team_wiki_publish:${TEAM_WIKI_PUBLISH_DB_PASSWORD:-local_publish_change_me}@postgres:5432/team_wiki
    depends_on:
      permissions:
        condition: service_completed_successfully

  classify-worker:
    <<: *app-runtime
    command: ['node', 'apps/worker/dist/main.js', 'classify']
    environment:
      <<: *app-environment
      APP_ROLE: classify
      DATABASE_URL: postgres://team_wiki_classify:${TEAM_WIKI_CLASSIFY_DB_PASSWORD:-local_classify_change_me}@postgres:5432/team_wiki
    depends_on:
      permissions:
        condition: service_completed_successfully

  reconcile-worker:
    <<: *app-runtime
    command: ['node', 'apps/worker/dist/main.js', 'reconcile']
    environment:
      <<: *app-environment
      APP_ROLE: reconcile
      DATABASE_URL: postgres://team_wiki_reconcile:${TEAM_WIKI_RECONCILE_DB_PASSWORD:-local_reconcile_change_me}@postgres:5432/team_wiki
    depends_on:
      permissions:
        condition: service_completed_successfully

volumes:
  postgres-data:
