          $ref: '#/components/schemas/Timestamp'
    CreateDraftRequest:
      type: object
      additionalProperties: false
      properties:
        title:
          type: string
          maxLength: 300
          default: ''
        markdown:
          type: string
          maxLength: 1000000
          default: ''
    UpdateDraftRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        title:
          type: string
          maxLength: 300
        markdown:
          type: string
          maxLength: 1000000
    DraftPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Draft'
        next_cursor:
          type: [string, 'null']
    PublishDraftRequest:
      type: object
      additionalProperties: false
      required: [draft_revision]
      properties:
        draft_revision:
          type: integer
          minimum: 1
    PublishRequest:
      type: object
      additionalProperties: false
      required: [id, draft_id, draft_revision, status, created_at, updated_at]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        draft_id:
          $ref: '#/components/schemas/Uuid'
        draft_revision:
          type: integer
        status:
          type: string
          enum: [queued, publishing, reconciling, succeeded, retryable_failed, blocked_failed]
        article_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        commit_sha:
          type: [string, 'null']
          pattern: '^[a-f0-9]{40,64}$'
        error_code:
          type: [string, 'null']
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
    ArticleSummary:
      type: object
      required: [id, title, author_id, status, current_commit_sha, published_at, classification_status]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        title:
          type: string
        author_id:
          $ref: '#/components/schemas/Uuid'
        status:
          type: string
          enum: [published, unpublished, deleted]
        current_commit_sha:
          type: string
        published_at:
          $ref: '#/components/schemas/Timestamp'
        classification_status:
          type: string
          enum: [pending, classified, needs_review, failed, disabled]
    ArticleDetail:
      unevaluatedProperties: false
