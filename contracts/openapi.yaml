        id:
          $ref: '#/components/schemas/Uuid'
        article_id:
          $ref: '#/components/schemas/Uuid'
        commit_sha:
          type: string
        content_hash:
          type: string
          description: Hash of the canonical published index.md bytes.
        body_hash:
          type: string
          description: Hash of the author's normalized Markdown body bytes.
        source:
          type: string
          enum: [application, github]
        created_at:
          $ref: '#/components/schemas/Timestamp'
    ArticlePage:
