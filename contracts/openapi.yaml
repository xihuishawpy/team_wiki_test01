        - $ref: '#/components/schemas/ArticleSummary'
        - type: object
          required: [markdown, body_hash, content_hash]
          properties:
            markdown:
              type: string
            body_hash:
              type: string
              pattern: '^sha256:[a-f0-9]{64}$'
            content_hash:
              type: string
              pattern: '^sha256:[a-f0-9]{64}$'
              description: Hash of the canonical published index.md bytes.
            classification:
              oneOf:
                - $ref: '#/components/schemas/Classification'
                - type: 'null'
    ArticleVersion:
      type: object
      additionalProperties: false
      required: [id, article_id, commit_sha, body_hash, content_hash, source, created_at]
